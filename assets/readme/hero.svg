      <rect x="172" width="150" height="40" rx="20" fill="#e5eaff" fill-opacity="0.12" stroke="#9bafff" stroke-opacity="0.4"/>
      <text x="247" y="27" text-anchor="middle" fill="#eaf0ff" font-size="18" font-weight="600">Five languages</text>
    </g>
