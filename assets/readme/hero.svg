    <text y="78" fill="#ffffff" font-size="68" font-weight="700">Monica Docs</text>
    <text y="120" fill="#d8dfff" font-size="26">Local-first password management, explained.</text>
    <text y="164" fill="#aab8e9" font-size="20">Passwords · TOTP · Secure notes · WebDAV backup</text>
    <g transform="translate(0 204)">
