<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Monica Docs</title>
  <desc id="desc">Documentation for Monica, an Android local-first password vault with passwords, two-factor codes, secure notes, and local backup options.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111b43"/>
      <stop offset="1" stop-color="#253b85"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8d5cff"/>
      <stop offset="0.62" stop-color="#5176ff"/>
      <stop offset="1" stop-color="#47caff"/>
    </linearGradient>
    <linearGradient id="vault" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#607fff"/>
      <stop offset="1" stop-color="#ba78ff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#surface)"/>
  <path d="M0 300C176 245 256 382 447 314C627 250 729 205 922 254C1031 281 1105 259 1200 214V360H0Z" fill="#0c1433" opacity="0.62"/>
  <path d="M0 62H532" stroke="#7183ca" stroke-opacity="0.32"/>
  <path d="M0 298H532" stroke="#7183ca" stroke-opacity="0.22"/>

