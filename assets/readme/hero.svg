<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc">
  <title id="title">Monica Docs</title>
  <desc id="desc">Monica Docs: documentation for Monica, a local-first password manager with passwords, TOTP codes, secure notes, WebDAV backup, and a cross-platform ecosystem.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1122"/>
      <stop offset="0.58" stop-color="#0f1b35"/>
      <stop offset="1" stop-color="#16264a"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3d6fc8" stop-opacity="0.42"/>
      <stop offset="0.6" stop-color="#3d6fc8" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#3d6fc8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe6ff"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f2f7ff"/>
    </linearGradient>
    <linearGradient id="badge" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#deeafb"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#7c93c9" stroke-opacity="0.09"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1200" height="450" rx="26"/>
    </clipPath>
    <filter id="pageShadow" x="-40%" y="-30%" width="180%" height="170%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#030814" flood-opacity="0.5"/>
    </filter>
    <filter id="badgeShadow" x="-40%" y="-40%" width="180%" height="190%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#02060f" flood-opacity="0.55"/>
    </filter>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="450" fill="url(#bg)"/>
    <ellipse cx="980" cy="230" rx="380" ry="330" fill="url(#halo)"/>
    <rect width="1200" height="450" fill="url(#grid)"/>

    <!-- Safe-dial ring behind the docs stack -->
    <g>
      <circle cx="950" cy="226" r="204" fill="none" stroke="#6c82b0" stroke-opacity="0.42" stroke-dasharray="2 11"/>
      <circle cx="950" cy="226" r="172" fill="none" stroke="#6c82b0" stroke-opacity="0.26"/>
      <g stroke="#6c82b0" stroke-opacity="0.45" stroke-linecap="round">
        <line x1="950" y1="12" x2="950" y2="22" transform="rotate(0 950 226)"/>
        <line x1="950" y1="12" x2="950" y2="22" transform="rotate(22.5 950 226)"/>
        <line x1="950" y1="12" x2="950" y2="22" transform="rotate(45 950 226)"/>
        <line x1="950" y1="12" x2="950" y2="22" transform="rotate(67.5 950 226)"/>
        <line x1="950" y1="12" x2="950" y2="22" transform="rotate(90 950 226)"/>
        <line x1="950" y1="12" x2="950" y2="22" transform="rotate(112.5 950 226)"/>
        <line x1="950" y1="12" x2="950" y2="22" transform="rotate(135 950 226)"/>
        <line x1="950" y1="12" x2="950" y2="22" transform="rotate(157.5 950 226)"/>
        <line x1="950" y1="12" x2="950" y2="22" transform="rotate(180 950 226)"/>
        <line x1="950" y1="12" x2="950" y2="22" transform="rotate(202.5 950 226)"/>
        <line x1="950" y1="12" x2="950" y2="22" transform="rotate(225 950 226)"/>
        <line x1="950" y1="12" x2="950" y2="22" transform="rotate(247.5 950 226)"/>
        <line x1="950" y1="12" x2="950" y2="22" transform="rotate(270 950 226)"/>
        <line x1="950" y1="12" x2="950" y2="22" transform="rotate(292.5 950 226)"/>
        <line x1="950" y1="12" x2="950" y2="22" transform="rotate(315 950 226)"/>
        <line x1="950" y1="12" x2="950" y2="22" transform="rotate(337.5 950 226)"/>
      </g>
      <path d="M979.9 56.6A172 172 0 0 1 1099 140" fill="none" stroke="#5a93f5" stroke-opacity="0.8" stroke-width="3" stroke-linecap="round"/>
      <circle cx="1099" cy="140" r="3.6" fill="#5a93f5"/>
    </g>

    <!-- Documentation stack -->
    <g filter="url(#pageShadow)">
      <g transform="rotate(-10 1028 368)">
        <rect x="928" y="84" width="200" height="284" rx="17" fill="#d6e4f8" stroke="#a9c1e4" stroke-opacity="0.9"/>
      </g>
      <g transform="rotate(10 1028 368)">
        <rect x="928" y="84" width="200" height="284" rx="17" fill="#e3eefc" stroke="#b7cbeb" stroke-opacity="0.9"/>
      </g>
      <rect x="928" y="84" width="200" height="284" rx="17" fill="url(#page)" stroke="#d2dff3"/>
      <text x="1108" y="113" text-anchor="end" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" letter-spacing="2.6" fill="#7f93b8">DOCS</text>
      <rect x="1016" y="130" width="88" height="10" rx="5" fill="#bfd0e8"/>
      <rect x="1016" y="150" width="60" height="8" rx="4" fill="#dbe7f6"/>
      <rect x="1016" y="186" width="94" height="7" rx="3.5" fill="#dbe6f6"/>
      <rect x="1016" y="205" width="84" height="7" rx="3.5" fill="#dbe6f6"/>
      <rect x="1016" y="224" width="98" height="7" rx="3.5" fill="#dbe6f6"/>
      <rect x="1016" y="243" width="70" height="7" rx="3.5" fill="#dbe6f6"/>
      <circle cx="1096" cy="326" r="12" fill="#dff6ef"/>
      <path d="M1090.5 326.4 1094.5 330.5 1101.5 322.7" fill="none" stroke="#1fae93" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Mascot badge -->
    <circle cx="856" cy="226" r="146" fill="url(#badge)" filter="url(#badgeShadow)"/>
    <circle cx="856" cy="226" r="146" fill="none" stroke="#ffffff" stroke-opacity="0.9"/>
    <circle cx="856" cy="226" r="130" fill="none" stroke="#c9d9f0" stroke-opacity="0.65"/>

    <g transform="translate(856 246) scale(0.86)">
      <path d="M-64 -92A64 64 0 0 1 64 -92" fill="none" stroke="#96e9cd" stroke-width="27"/>
      <rect x="-110" y="-92" width="220" height="184" rx="50" fill="#6fb1fd"/>
      <rect x="-88" y="-70" width="176" height="140" rx="32" fill="#1e212b"/>
      <rect x="-41" y="-44" width="14" height="28" rx="7" fill="#96e9cd"/>
      <rect x="27" y="-44" width="14" height="28" rx="7" fill="#96e9cd"/>
      <path d="M-31 -8C-31 8-17 18 0 18S31 8 31-8" fill="none" stroke="#96e9cd" stroke-width="11" stroke-linecap="round"/>
      <g transform="rotate(-12 86 44)">
        <rect x="-56" y="33" width="102" height="22" rx="11" fill="#fdd43b"/>
        <rect x="-58" y="52" width="13" height="26" rx="6.5" fill="#fdd43b"/>
        <rect x="-37" y="52" width="13" height="26" rx="6.5" fill="#fdd43b"/>
        <rect x="-16" y="52" width="13" height="26" rx="6.5" fill="#fdd43b"/>
        <circle cx="86" cy="44" r="22" fill="none" stroke="#fdd43b" stroke-width="20"/>
      </g>
    </g>
    <text x="856" y="352" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="700" letter-spacing="3" fill="#7183a8">LOCAL VAULT</text>

    <!-- Brand confetti -->
    <rect x="758" y="326" width="18" height="8" rx="4" fill="#96e9cd" transform="rotate(20 767 330)"/>
    <circle cx="944" cy="114" r="5" fill="#a48cf0"/>
    <path d="M0 -6 1.5 -1.5 6 0 1.5 1.5 0 6 -1.5 1.5 -6 0 -1.5 -1.5Z" fill="#fdd43b" transform="translate(744 158)"/>

    <!-- Copy -->
    <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans', 'Microsoft YaHei', sans-serif">
      <circle cx="68" cy="74" r="4.5" fill="#96e9cd"/>
      <text x="84" y="79" font-size="14.5" font-weight="700" letter-spacing="3.2" fill="#8fb6ff">MONICA PASS · DOCUMENTATION</text>
      <text x="62" y="210" font-size="92" font-weight="800" letter-spacing="-3" fill="url(#ink)">Monica Docs</text>
      <text x="64" y="262" font-size="26" fill="#c3cfea">Local-first password management, explained.</text>
      <text x="64" y="304" font-size="17" fill="#8fa2c9">Passwords · TOTP · Secure notes · WebDAV backup</text>

      <g transform="translate(64 328)">
        <rect width="140" height="42" rx="21" fill="#ffffff" fill-opacity="0.05" stroke="#33456c"/>
        <text x="70" y="27" text-anchor="middle" font-size="16.5" font-weight="600" fill="#e8eeff">Open source</text>
        <g transform="translate(152 0)">
          <rect width="166" height="42" rx="21" fill="#ffffff" fill-opacity="0.05" stroke="#33456c"/>
          <text x="83" y="27" text-anchor="middle" font-size="16.5" font-weight="600" fill="#e8eeff">Five languages</text>
        </g>
        <g transform="translate(330 0)">
          <rect width="104" height="42" rx="21" fill="#ffffff" fill-opacity="0.05" stroke="#33456c"/>
          <text x="52" y="27" text-anchor="middle" font-size="16.5" font-weight="600" fill="#e8eeff">Android</text>
        </g>
      </g>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="449" rx="25.5" fill="none" stroke="#2b3c66" stroke-opacity="0.85"/>
</svg>
