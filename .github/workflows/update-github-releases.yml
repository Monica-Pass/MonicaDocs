name: Update GitHub releases

on:
  repository_dispatch:
    types: [monica-release-published]
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-github-releases
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Fetch GitHub releases
        run: node scripts/fetch-github-releases.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.MONICA_SOURCE_REPO_TOKEN }}
          GITHUB_RELEASES_PER_REPO: "10"

      - name: Commit updated data
        id: commit
        run: |
          if git diff --quiet -- public/github-releases.json; then
            echo "No GitHub release data changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/github-releases.json
          git commit -m "chore: update github release data"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger website deployment
        if: steps.commit.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "deploy-website.yml",
              ref: "main",
            });
