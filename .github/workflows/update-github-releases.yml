name: Update GitHub releases

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Fetch GitHub releases
        run: node scripts/fetch-github-releases.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.MONICA_SOURCE_REPO_TOKEN }}
          GITHUB_RELEASES_PER_REPO: "10"

      - name: Commit updated data
        run: |
          if git diff --quiet -- public/github-releases.json; then
            echo "No GitHub release data changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/github-releases.json
          git commit -m "chore: update github release data"
          git push
