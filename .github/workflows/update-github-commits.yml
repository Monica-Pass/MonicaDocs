name: Update GitHub commits

on:
  repository_dispatch:
    types: [monica-main-updated]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-github-commits
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Fetch GitHub commits
        run: node scripts/fetch-github-commits.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.MONICA_SOURCE_REPO_TOKEN }}
          GITHUB_COMMITS_REPO_OWNER: Monica-Pass
          GITHUB_COMMITS_REPO_NAME: Monica

      - name: Commit updated data
        id: commit
        run: |
          if git diff --quiet -- public/github-commits.json; then
            echo "No GitHub commit data changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/github-commits.json
          git commit -m "chore: update github commit data"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger website deployment
        if: steps.commit.outputs.changed == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "deploy-website.yml",
              ref: "main",
            });
